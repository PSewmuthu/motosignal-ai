name: Build and Push Docker Compose Image

on:
  push:
    branches:
      - master
    tags:
      - "v*" # Triggers on version tags like v1.0.0

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Log in to the Docker registry using GitHub Secrets
      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Set up a dynamic image tag based on the Git reference
      - name: Set Image Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # If triggered by a tag (e.g. v1.0.0), use the tag name
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            # If triggered by a branch push, use the short commit SHA
            echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi

      # Build the image using Docker Compose
      - name: Build with Docker Compose
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ env.TAG }}
        run: docker compose build

      # Push the specifically tagged image
      - name: Push Tagged Image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ env.TAG }}
        run: docker compose push

      # (Optional) Also tag and push as "latest" if on the main branch
      - name: Push Latest Image
        if: github.ref == 'refs/heads/main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: latest
        run: |
          docker compose build
          docker compose push
